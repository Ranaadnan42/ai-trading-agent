name: probe-mt5-installer
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for n in exness.technology.ltd exness.global.limited exness.ltd exness exness.cy.ltd exness.sc.ltd exness.limited exness.uk.ltd exness.vg.ltd exness.technologies.ltd exness.kenya.ltd exness.za.pty.ltd; do
            for f in exness5setup.exe mt5setup.exe; do
              echo "$(curl -s -o /dev/null -w '%{http_code}' -L "https://download.mql5.com/cdn/web/$n/mt5/$f") $n/$f"
            done
          done
          for u in https://www.exness.com/metatrader-5/ https://www.exness.com/platforms/ https://get.exness.help/hc/en-us/articles/360014073399 https://www.exness.global/metatrader-5/; do
            echo "== $u"; curl -sL -A "Mozilla/5.0" "$u" | grep -oE 'https?://[^"'"'"' ]*(setup|\.exe|download\.mql5|terminal)[^"'"'"' ]*' | sort -u | head -20
          done
