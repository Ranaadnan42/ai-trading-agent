name: Trading Agent (hourly)

on:
  schedule:
    - cron: "7 * * * 0-5"   # every hour, Sun-Fri (gold market hours)
  workflow_dispatch:
    inputs:
      mode:
        description: "paper | mt5 (blank = AGENT_MODE variable)"
        default: ""
      selftest:
        description: "Open and close a 0.01 lot demo trade to test execution"
        type: boolean
        default: false

concurrency:
  group: trading-agent
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ${{ (inputs.mode || vars.AGENT_MODE || 'mt5') == 'mt5' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    env:
      # public repo = free minutes -> stay up 5h deciding hourly, then chain; private repo -> one cycle per run
      LOOP_HOURS: ${{ vars.LOOP_HOURS || (github.event.repository.private && '0' || '5') }}
      MODE: ${{ inputs.mode || vars.AGENT_MODE || 'mt5' }}
      SYMBOL: ${{ vars.SYMBOL || 'XAUUSD' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EXNESS_LOGIN: ${{ secrets.EXNESS_LOGIN || vars.EXNESS_LOGIN || '474902137' }}
      EXNESS_PASSWORD: ${{ secrets.EXNESS_PASSWORD }}
      EXNESS_SERVER: ${{ secrets.EXNESS_SERVER || vars.EXNESS_SERVER || 'Exness-MT5Trial15' }}
      METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
      METAAPI_ACCOUNT_ID: ${{ secrets.METAAPI_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - if: env.MODE == 'metaapi'
        run: pip install metaapi-cloud-sdk
      - name: Install Exness MT5 terminal + AgentBridge EA
        if: env.MODE == 'mt5'
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\mt5setup.exe"
          for ($k = 1; $k -le 5; $k++) {
            try { Invoke-WebRequest "https://download.mql5.com/cdn/web/exness.technologies.ltd/mt5/exness5setup.exe" -OutFile $setup -TimeoutSec 120; break }
            catch { Write-Host "download try $k failed: $($_.Exception.Message)"; Remove-Item $setup -ErrorAction SilentlyContinue; Start-Sleep (20 * $k) }
          }
          if (-not (Test-Path $setup)) { throw "MT5 installer download failed 5 times" }
          Start-Process $setup -ArgumentList "/auto"
          for ($i = 0; $i -lt 60; $i++) {
            $t = Get-ChildItem "C:\Program Files" -Recurse -Filter terminal64.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($t) { break }
            Start-Sleep 5
          }
          if (-not $t) { throw "MT5 terminal did not install" }
          Start-Sleep 20
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          $root = Split-Path $t.FullName
          "MT5_PATH=$($t.FullName)" | Out-File -Append $env:GITHUB_ENV
          # compile our bridge EA
          $exp = "$root\MQL5\Experts"
          New-Item -ItemType Directory -Force $exp | Out-Null
          Copy-Item mt5\AgentBridge.mq5 $exp\
          Start-Process "$root\metaeditor64.exe" -ArgumentList "/portable", "/compile:`"$exp\AgentBridge.mq5`"", "/log:`"$env:RUNNER_TEMP\compile.log`"" -Wait
          Get-Content "$env:RUNNER_TEMP\compile.log" -Encoding Unicode -ErrorAction SilentlyContinue | Select-Object -Last 8
          if (-not (Test-Path "$exp\AgentBridge.ex5")) { throw "AgentBridge EA did not compile" }
          # log in
          if (-not $env:MT5_CHART_SYMBOL) { $env:MT5_CHART_SYMBOL = "XAUUSDm" }
          $ini = "$env:RUNNER_TEMP\mt5login.ini"
          @("[Common]", "Login=$env:EXNESS_LOGIN", "Password=$env:EXNESS_PASSWORD", "Server=$env:EXNESS_SERVER",
            "KeepPrivate=1", "NewsEnable=0",
            "[Experts]", "AllowLiveTrading=1", "AllowDllImport=0", "Enabled=1", "Account=0", "Profile=0",
            "[StartUp]", "Expert=AgentBridge", "Symbol=$env:MT5_CHART_SYMBOL", "Period=H1") | Out-File -Encoding ascii $ini
          Start-Process $t.FullName -ArgumentList "/portable", "/config:$ini"
          $state = "$root\MQL5\Files\state.txt"
          for ($i = 0; $i -lt 60 -and -not (Test-Path $state); $i++) { Start-Sleep 3 }
          Write-Host "files:" (Get-ChildItem "$root\MQL5\Files" -ErrorAction SilentlyContinue | ForEach-Object Name)
          Write-Host "mql logs:" (Get-ChildItem "$root\MQL5\Logs" -ErrorAction SilentlyContinue | ForEach-Object Name)
          Start-Sleep 5
          Remove-Item $ini
          Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { Write-Host "WINDOW $($_.MainWindowTitle)" }
          if (Test-Path $state) { Get-Content $state | Where-Object { $_ -notmatch "^(login)=" } } else { Write-Host "EA state file not found yet" }
          Get-ChildItem "$root\MQL5\Logs", "$root\logs" -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "== $($_.Name)"; Get-Content $_.FullName -Encoding Unicode -Tail 15 }
      - name: Execution self-test (0.01 lot open + close)
        if: inputs.selftest && env.MODE == 'mt5'
        run: |
          python - <<'PY'
          import time
          from agent import broker
          b = broker.MT5Broker({})
          p = b.price()
          pos = b.open("BUY", 0.01, p["ask"] - 20, p["ask"] + 20, "selftest")
          print("opened", pos)
          time.sleep(3)
          b.modify_sl(pos["id"], p["ask"] - 25)
          print("modified", [x for x in b.positions() if x["id"] == pos["id"]])
          print("closed", b.close_position(pos["id"]))
          time.sleep(3)
          print("closed trades", b.sync_closed())
          print("account", b.account())
          PY
      - name: Agent cycle
        # LOOP_HOURS (repo variable): 0 = one cycle per run (default).
        # e.g. 5 = keep MT5 open and decide every hour for 5 hours, then hand over to the next run.
        run: |
          end=$(( $(date +%s) + LOOP_HOURS * 3600 ))
          rc=0
          while :; do
            python -m agent.run && rc=0 || rc=1
            bash .github/save_memory.sh
            next=$(( ( $(date +%s) / 3600 + 1 ) * 3600 + 420 ))   # next hh:07 UTC
            [ "$next" -lt "$end" ] || break
            sleep $(( next - $(date +%s) ))
          done
          exit $rc
      - name: Save memory (journal, lessons, state)
        if: always()
        run: bash .github/save_memory.sh
      - name: Hand over to the next run (loop mode)
        if: always() && env.LOOP_HOURS != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dow=$(date -u +%u); h=$(date -u +%H)
          # gold is closed Fri ~21:00 UTC -> Sun ~22:00 UTC; the Sunday schedule restarts the chain
          if [ "$dow" -eq 6 ] || { [ "$dow" -eq 5 ] && [ "$h" -ge 20 ]; }; then echo "weekend - chain stops"; exit 0; fi
          gh workflow run agent.yml --ref main -f mode="${MODE}"
