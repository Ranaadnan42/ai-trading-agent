name: Trading Agent (hourly)

on:
  schedule:
    - cron: "7 * * * 0-5"   # every hour, Sun-Fri (gold market hours)
  workflow_dispatch:
    inputs:
      mode:
        description: "paper | mt5 (blank = AGENT_MODE variable)"
        default: ""

concurrency:
  group: trading-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ${{ (inputs.mode || vars.AGENT_MODE || 'paper') == 'mt5' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      MODE: ${{ inputs.mode || vars.AGENT_MODE || 'paper' }}
      SYMBOL: ${{ vars.SYMBOL || 'XAUUSD' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EXNESS_LOGIN: ${{ secrets.EXNESS_LOGIN || vars.EXNESS_LOGIN || '474902137' }}
      EXNESS_PASSWORD: ${{ secrets.EXNESS_PASSWORD }}
      EXNESS_SERVER: ${{ secrets.EXNESS_SERVER || vars.EXNESS_SERVER || 'Exness-MT5Trial15' }}
      METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
      METAAPI_ACCOUNT_ID: ${{ secrets.METAAPI_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - if: env.MODE == 'metaapi'
        run: pip install metaapi-cloud-sdk
      - name: Install Exness MT5 terminal
        if: env.MODE == 'mt5'
        shell: pwsh
        run: |
          pip install MetaTrader5==5.0.5640
          $urls = @(
            "https://download.mql5.com/cdn/web/exness.technology.ltd/mt5/exness5setup.exe",
            "https://download.mql5.com/cdn/web/exness.global.limited/mt5/exness5setup.exe",
            "https://download.mql5.com/cdn/web/exness.ltd/mt5/exness5setup.exe",
            "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          )
          $ok = $false
          foreach ($u in $urls) {
            try { Invoke-WebRequest $u -OutFile "$env:RUNNER_TEMP\mt5setup.exe"; Write-Host "Downloaded $u"; $ok = $true; break }
            catch { Write-Host "Not found: $u" }
          }
          if (-not $ok) { throw "Could not download MT5 installer" }
          Start-Process "$env:RUNNER_TEMP\mt5setup.exe" -ArgumentList "/auto"
          for ($i = 0; $i -lt 60; $i++) {
            $t = Get-ChildItem "C:\Program Files" -Recurse -Filter terminal64.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($t) { break }
            Start-Sleep 5
          }
          if (-not $t) { throw "MT5 terminal did not install" }
          Start-Sleep 20
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          "MT5_PATH=$($t.FullName)" | Out-File -Append $env:GITHUB_ENV
          Write-Host "MT5 installed at $($t.FullName)"
          $ini = "$env:RUNNER_TEMP\mt5login.ini"
          @("[Common]", "Login=$env:EXNESS_LOGIN", "Password=$env:EXNESS_PASSWORD", "Server=$env:EXNESS_SERVER",
            "KeepPrivate=1", "NewsEnable=0", "[Experts]", "AllowLiveTrading=1", "Enabled=1") | Out-File -Encoding ascii $ini
          Start-Process $t.FullName -ArgumentList "/portable", "/config:$ini"
          # First run pops an "Open an Account" wizard that blocks the Python IPC; close it.
          $sh = New-Object -ComObject WScript.Shell
          for ($i = 0; $i -lt 18; $i++) {
            Start-Sleep 5
            foreach ($w in @("Open an Account", "Login to Trade Account", "Open an account")) {
              if ($sh.AppActivate($w)) { Start-Sleep 1; $sh.SendKeys("{ESC}"); Write-Host "Closed dialog: $w" }
            }
          }
          Remove-Item $ini
          Write-Host "--- processes with windows:"
          Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { Write-Host "  $($_.ProcessName): $($_.MainWindowTitle)" }
          Write-Host "--- terminal64 running:" ((Get-Process terminal64 -ErrorAction SilentlyContinue | Measure-Object).Count)
          Write-Host "--- session:" ([System.Diagnostics.Process]::GetCurrentProcess().SessionId) "interactive:" ([Environment]::UserInteractive)
          Get-ChildItem (Split-Path $t.FullName) -Directory | ForEach-Object { Write-Host "  dir: $($_.Name)" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\shots" | Out-Null
          $bmp.Save("$env:RUNNER_TEMP\shots\mt5.png")
          Get-ChildItem (Split-Path $t.FullName) -Recurse -Filter *.log -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\logs\\" } | ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content $_.FullName -Tail 40 }
      - name: Agent cycle
        run: python -m agent.run
      - name: Screenshot of MT5 runner desktop
        if: always() && env.MODE == 'mt5'
        uses: actions/upload-artifact@v4
        with:
          name: mt5-screen
          path: ${{ runner.temp }}/shots
          retention-days: 3
      - name: Save memory (journal, lessons, state)
        if: always()
        run: |
          git config user.name "trading-agent"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "agent: cycle $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
