name: Trading Agent (hourly)

on:
  schedule:
    - cron: "7 * * * 0-5"   # every hour, Sun-Fri (gold market hours)
  workflow_dispatch:

concurrency:
  group: trading-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ${{ (vars.AGENT_MODE || 'mt5') == 'mt5' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      MODE: ${{ vars.AGENT_MODE || 'mt5' }}
      SYMBOL: ${{ vars.SYMBOL || 'XAUUSD' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EXNESS_LOGIN: ${{ secrets.EXNESS_LOGIN || vars.EXNESS_LOGIN || '474902137' }}
      EXNESS_PASSWORD: ${{ secrets.EXNESS_PASSWORD }}
      EXNESS_SERVER: ${{ secrets.EXNESS_SERVER || vars.EXNESS_SERVER || 'Exness-MT5Trial15' }}
      METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
      METAAPI_ACCOUNT_ID: ${{ secrets.METAAPI_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - if: env.MODE == 'metaapi'
        run: pip install metaapi-cloud-sdk
      - name: Install Exness MT5 terminal
        if: env.MODE == 'mt5'
        shell: pwsh
        run: |
          pip install MetaTrader5
          Invoke-WebRequest "https://download.mql5.com/cdn/web/exness.technology.ltd/mt5/exness5setup.exe" -OutFile "$env:RUNNER_TEMP\mt5setup.exe"
          Start-Process "$env:RUNNER_TEMP\mt5setup.exe" -ArgumentList "/auto"
          for ($i = 0; $i -lt 60; $i++) {
            $t = Get-ChildItem "C:\Program Files" -Recurse -Filter terminal64.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($t) { break }
            Start-Sleep 5
          }
          if (-not $t) { throw "MT5 terminal did not install" }
          Start-Sleep 20
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          "MT5_PATH=$($t.FullName)" | Out-File -Append $env:GITHUB_ENV
          Write-Host "MT5 installed at $($t.FullName)"
      - name: Agent cycle
        run: python -m agent.run
      - name: Save memory (journal, lessons, state)
        if: always()
        run: |
          git config user.name "trading-agent"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "agent: cycle $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
